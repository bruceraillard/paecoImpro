<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Projecteur – Impro Multijoueur</title>
    <link rel="stylesheet" href="../assets/fonts/fonts.css"/>
    <link rel="stylesheet" href="projector.css"/>
</head>
<body>
<div class="logo-container">
    <img src="../assets/media/logo.webp" alt="Logo du jeu"/>
</div>

<div class="stars" aria-hidden="true"></div>

<main>
    <!-- Animated timer for the current phase -->
    <section id="timer-display" aria-live="polite">
        <div class="circle-timer">
            <svg viewBox="0 0 400 400" class="progress-ring" aria-hidden="true">
                <circle class="background" cx="200" cy="200" r="180"></circle>
                <circle class="progress" cx="200" cy="200" r="180"></circle>
            </svg>
            <div class="timer-text" id="timer-value" aria-label="Temps restant">00:00</div>
        </div>
        <p id="phase-label" aria-label="Phase"></p>
    </section>

    <!-- Details sent from the control desk for context -->
    <section id="round-info">
        <h3>Thème :<br><span id="display-theme">—</span></h3>
        <h3>Catégorie :<br><span id="display-category">—</span></h3>
    </section>

    <!-- Team scoreboard mirrored from the control view -->
    <section id="teams-display" aria-label="Scores des équipes"></section>
</main>

<script src="../shared/game-state.js"></script>
<script src="projector.js"></script>
</body>
</html>
